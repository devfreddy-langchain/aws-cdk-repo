# k8s/db-admin-externalsecret.yaml — the RDS master credentials, for the database bootstrap Job only
# (post-deploy/04 step 8). Created right before the Job and deleted right after it, whatever the result.
# Placeholders filled by post-deploy/04:
#   NS, CONNECTIONS_SECRET (output ConnectionsSecretName: the database host names)
#   CORE_MASTER_SECRET, META_MASTER_SECRET (outputs CoreDbMasterSecretArn, MetastoreDbMasterSecretArn:
#   the secrets RDS manages for the master users)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: langsmith-db-admin, namespace: ${NS} }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secretsmanager }
  target: { name: langsmith-db-admin, creationPolicy: Owner, deletionPolicy: Delete }
  data:
    - { secretKey: CORE_PGHOST,     remoteRef: { key: "${CONNECTIONS_SECRET}", property: core_host } }
    - { secretKey: CORE_PGUSER,     remoteRef: { key: "${CORE_MASTER_SECRET}", property: username } }
    - { secretKey: CORE_PGPASSWORD, remoteRef: { key: "${CORE_MASTER_SECRET}", property: password } }
    - { secretKey: META_PGHOST,     remoteRef: { key: "${CONNECTIONS_SECRET}", property: metastore_host } }
    - { secretKey: META_PGUSER,     remoteRef: { key: "${META_MASTER_SECRET}", property: username } }
    - { secretKey: META_PGPASSWORD, remoteRef: { key: "${META_MASTER_SECRET}", property: password } }
