# k8s/externalsecrets.yaml — the ClusterSecretStore and every ExternalSecret the LangSmith chart reads
# (post-deploy/04 step 7, kubectl apply). Nothing secret is in this file: each ExternalSecret maps a
# Secrets Manager secret (or one JSON property of it) to a key of a Kubernetes Secret.
# Placeholders filled by post-deploy/04:
#   NS                  the LangSmith namespace
#   AWS_REGION          the region of the secrets
#   SECRETS_PREFIX      output SecretsPrefix (<name>/): the secrets CDK created and 01 filled in
#   CONNECTIONS_SECRET  output ConnectionsSecretName: host names and IAM user names, no passwords
#   ESO_AUTH            how the store authenticates:
#                         irsa         auth: jwt with the external-secrets ServiceAccount's token
#                         podIdentity  no auth block (ESO's own pod credentials)
# Redis database index: 0 core, 1 Fleet, 2 Chat (polly), 3 Insights (in the connection URLs).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: aws-secretsmanager }
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
      ${ESO_AUTH}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: langsmith-secrets, namespace: ${NS} }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secretsmanager }
  target: { name: langsmith-secrets, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - { secretKey: langsmith_license_key, remoteRef: { key: "${SECRETS_PREFIX}license-key" } }
    - { secretKey: api_key_salt, remoteRef: { key: "${SECRETS_PREFIX}api-key-salt" } }
    - { secretKey: jwt_secret, remoteRef: { key: "${SECRETS_PREFIX}jwt-secret" } }
    - { secretKey: initial_org_admin_password, remoteRef: { key: "${SECRETS_PREFIX}initial-org-admin-password" } }
    - { secretKey: agent_builder_encryption_key, remoteRef: { key: "${SECRETS_PREFIX}fernet/agent-builder" } }
    - { secretKey: insights_encryption_key, remoteRef: { key: "${SECRETS_PREFIX}fernet/insights" } }
    - { secretKey: polly_encryption_key, remoteRef: { key: "${SECRETS_PREFIX}fernet/polly" } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: langsmith-postgres, namespace: ${NS} }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secretsmanager }
  target: { name: langsmith-postgres, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - { secretKey: connection_url, remoteRef: { key: "${CONNECTIONS_SECRET}", property: core_postgres_url } }
---
