# k8s/storage.yaml — StorageClasses and the LangSmith namespace (post-deploy/04 step 2, kubectl apply).
# Placeholders filled by post-deploy/04: NS (the LangSmith namespace)
#
# gp3 becomes the default class (EKS starts with gp2). smithdb-cache is what SmithDB's per-pod cache
# volumes use: gp3 at 7000 IOPS / 1000 MiB/s, as the SmithDB docs require. WaitForFirstConsumer creates
# each volume in its pod's AZ. Volumes are encrypted with the AWS-managed EBS key.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations: { storageclass.kubernetes.io/is-default-class: "true" }
provisioner: ebs.csi.aws.com
parameters: { type: gp3, encrypted: "true" }
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: smithdb-cache
provisioner: ebs.csi.aws.com
parameters: { type: gp3, iops: "7000", throughput: "1000", encrypted: "true" }
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
---
apiVersion: v1
kind: Namespace
metadata:
  name: ${NS}
  labels:
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
