# helm/external-secrets.yaml — Helm values for the External Secrets Operator (namespace external-secrets).
# Edit, then re-apply with: ./post-deploy/04-cluster-prereqs.sh platform
# Placeholders filled by post-deploy/04: IMAGE_BASE ESO_SA_ANNOTATIONS
# ESO_SA_ANNOTATIONS is { eks.amazonaws.com/role-arn: "<role>" } with IRSA, {} with Pod Identity.
# The AWS region is set on the ClusterSecretStore (04 step "secrets"), not here.
installCRDs: true
image: { repository: ${IMAGE_BASE}/external-secrets/external-secrets }
webhook: { image: { repository: ${IMAGE_BASE}/external-secrets/external-secrets } }
certController: { image: { repository: ${IMAGE_BASE}/external-secrets/external-secrets } }
serviceAccount:
  name: external-secrets
  annotations: ${ESO_SA_ANNOTATIONS}
